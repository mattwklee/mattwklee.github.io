<!-- Site-wide interactions: scroll reveal + back-to-top -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  /* Scroll reveal */
  var revealables = document.querySelectorAll('.member-card, .research-card, .logo-item, .pub-section, .contact-block, .member-featured');
  if ('IntersectionObserver' in window && revealables.length) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('revealed'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    revealables.forEach(function (el) { el.classList.add('reveal-init'); io.observe(el); });
  }
  /* Back to top */
  var btn = document.createElement('button');
  btn.id = 'back-to-top';
  btn.setAttribute('aria-label', 'Back to top');
  btn.innerHTML = '&#8963;';
  document.body.appendChild(btn);
  btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  window.addEventListener('scroll', function () {
    btn.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
});
</script>

<!-- Scroll progress busbar -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var bar = document.createElement('div');
  bar.id = 'scroll-progress';
  document.body.appendChild(bar);
  function update() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
});
</script>

<!-- 3D tilt + glare on cards (desktop, motion-safe) -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var noMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fine || noMotion) { return; }
  document.querySelectorAll('.member-card, .research-card').forEach(function (card) {
    card.classList.add('tiltable');
    card.addEventListener('pointermove', function (e) {
      var r = card.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width;
      var py = (e.clientY - r.top) / r.height;
      card.style.transform = 'perspective(700px) rotateY(' + ((px - 0.5) * 7) + 'deg) rotateX(' + ((0.5 - py) * 7) + 'deg) translateY(-3px)';
      card.style.setProperty('--mx', (px * 100) + '%');
      card.style.setProperty('--my', (py * 100) + '%');
    });
    card.addEventListener('pointerleave', function () {
      card.style.transform = '';
    });
  });
});
</script>
