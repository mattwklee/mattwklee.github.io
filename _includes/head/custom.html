<!-- Site-wide interactions: scroll reveal + back-to-top -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  /* Scroll reveal */
  var revealables = document.querySelectorAll('.member-card, .research-card, .logo-item, .pub-section, .contact-block, .member-featured');
  if ('IntersectionObserver' in window && revealables.length) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('revealed'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    revealables.forEach(function (el) { el.classList.add('reveal-init'); io.observe(el); });
  }
  /* Back to top */
  var btn = document.createElement('button');
  btn.id = 'back-to-top';
  btn.setAttribute('aria-label', 'Back to top');
  btn.innerHTML = '&#8963;';
  document.body.appendChild(btn);
  btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  window.addEventListener('scroll', function () {
    btn.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
});
</script>
